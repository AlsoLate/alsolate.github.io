<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 防止移动端浏览器自动缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 客户端时间线</title>
  <link rel="stylesheet" href="styles.css?v=20261024f">
</head>
<body data-theme="minimal">

  <header class="site-header">
    <div>
      <h1 class="site-title">Minecraft 客户端时间线</h1>
      <p class="site-subtitle">各类客户端的发展历程。</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label class="control-label">视图</label>
        <select id="view-mode">
          <option value="graph">图谱</option>
          <option value="horizontal">横向</option>
          <option value="vertical">纵向</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">主题</label>
        <select id="theme-select">
          <option value="minimal">白色</option>
          <option value="midnight">深色</option>
          <option value="cyberpunk">赛博朋克</option>
          <option value="retro">复古绿</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">排序</label>
        <select id="sort-order">
          <option value="desc">最新→最早</option>
          <option value="asc">最早→最新</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <!-- 时间线容器：卡片与引导线由 JS 注入，视图类名也由 JS 按屏幕尺寸设置 -->
    <div id="timeline" class="timeline"></div>
  </main>

  <div id="zoom-badge" class="zoom-badge" aria-hidden="true"></div>

  <footer class="site-footer">
    <p>时间线数据源：<a href="https://github.com/CheatCracker/CheatCracker.github.io/blob/main/timeline.json">timeline.json</a> —— 编辑该文件即可更新时间线。</p>
    <p class="footer-note">反作弊：2b2t.org 自 1.19 起为 GrimAC（此前 NCP）｜2b2t.xin 为 NCP魔改版｜3c3u.org 自 2024.5 起为 GrimAC v3 魔改版（此前 NCP）</p>
  </footer>

  <script src="ui.js?v=20261024f"></script>
  <script src="script.js?v=20261024f"></script>
</body>
</html>
